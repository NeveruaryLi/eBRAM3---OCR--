<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBRAM AI 调解员简报</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preload" href="/static/fonts/outfit-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/outfit-600.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<div class="layout">

  <!-- ── 侧边栏 ── -->
  <nav class="sidebar">
    <div class="sidebar-top">
      <div class="logo-wrap">
        <div class="logo"><span class="logo-mark">e</span>BRAM</div>
        <div class="logo-sub">AI 文档助手</div>
      </div>
      <button class="theme-btn" id="themeBtn" title="切换主题" aria-label="切换深色/浅色主题">
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun"  width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
    <a class="new-chat-btn" href="/" style="text-decoration:none; justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      返回选择
    </a>
    <div class="history-section">
      <div class="sidebar-label">最近对话</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </nav>

  <!-- ── 主区域 ── -->
  <main class="main">
    <div class="messages-wrap" id="messagesWrap">
      <div class="welcome" id="welcome">
        <div class="welcome-badge">Case 2 · 调解员简报</div>
        <h1>调解员简报生成</h1>
        <p>上传甲乙双方及共用 PDF 材料（共 7 份），AI 综合解析并生成结构化调解员简报</p>
        <div class="welcome-cards">
          <div class="welcome-card">
            <div class="wc-icon-wrap wc-icon-upload">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </div>
            <div><strong>7 份材料</strong><small>甲方×3、乙方×3、共用×1 PDF 文件</small></div>
          </div>
          <div class="welcome-card">
            <div class="wc-icon-wrap wc-icon-analyze">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>
            <div><strong>综合分析</strong><small>Agent C 整合三方材料，生成调解员简报</small></div>
          </div>
          <div class="welcome-card">
            <div class="wc-icon-wrap wc-icon-chat">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
              </svg>
            </div>
            <div><strong>深度追问</strong><small>针对简报内容进行后续对话</small></div>
          </div>
        </div>
        <!-- 开发中提示 -->
        <div style="margin-top:2rem; padding:1rem 1.25rem; border-radius:8px; background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.2); color:var(--text-muted); font-size:0.82rem; text-align:center;">
          🚧 &nbsp;功能开发中，即将上线
        </div>
      </div>
      <div class="messages-list" id="messagesList"></div>
    </div>

    <!-- 输入区域（禁用状态） -->
    <div class="input-area">
      <div class="input-box" id="inputBox">
        <label class="attach-btn" style="opacity:0.4; cursor:not-allowed;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </label>
        <textarea id="textInput" placeholder="功能开发中..." rows="1" disabled style="opacity:0.4;"></textarea>
        <button class="send-btn" disabled style="opacity:0.4;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-footer">eBRAM AI 可能出现错误，重要内容请自行核实 &nbsp;·&nbsp; Case 2 开发中</div>
    </div>

  </main>
</div>

<script>
  // 主题切换
  const themeBtn = document.getElementById('themeBtn');
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.documentElement.classList.add('light');
  themeBtn.addEventListener('click', () => {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });
</script>
</body>
</html>
